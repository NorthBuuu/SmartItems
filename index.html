<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能物品成本管理</title>
    <style>
        /* 全局样式 */
        :root {
            --bg-color: #f8fafc; /* slate-50 */
            --card-bg: #ffffff;
            --primary-color: #4f46e5; /* indigo-600 */
            --primary-hover: #4338ca; /* indigo-700 */
            --secondary-color: #3b82f6; /* blue-500 */
            --text-primary: #1e293b; /* slate-800 */
            --text-secondary: #64748b; /* slate-500 */
            --border-color: #e2e8f0; /* slate-200 */
            --success-color: #10b981; /* emerald-500 */
            --danger-color: #ef4444; /* red-500 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --border-radius: 12px;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: var(--spacing-lg);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xl);
            color: var(--text-primary);
            text-align: center;
        }

        /* 卡片样式 */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-row {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.2s ease;
            background-color: var(--card-bg);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* 按钮样式 */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--text-secondary);
            color: white;
        }

        /* 物品列表样式 */
        .items-list {
            display: grid;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
        }

        .item-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .meta-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .item-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        /* 状态提示样式 */
        .status-message {
            padding: var(--spacing-md);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-lg);
            text-align: center;
            font-weight: 500;
        }

        .status-empty {
            background-color: var(--border-color);
            color: var(--text-secondary);
        }

        /* 响应式设计 */
        @media (max-width: 640px) {
            body {
                padding: var(--spacing-md);
            }

            h1 {
                font-size: 2rem;
            }

            .form-row {
                flex-direction: column;
            }

            .item-card {
                flex-direction: column;
                gap: var(--spacing-md);
            }

            .item-actions {
                justify-content: center;
                margin-top: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>智能物品成本管理</h1>

        <!-- 添加物品卡片 -->
        <div class="card">
            <form id="addItemForm">
                <div class="form-group">
                    <label for="itemName">物品名称</label>
                    <input type="text" id="itemName" placeholder="请输入物品名称" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemPrice">价格 (¥)</label>
                        <input type="number" id="itemPrice" min="0" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="dateType">日期输入</label>
                        <select id="dateType" required>
                            <option value="date">购入日期</option>
                            <option value="days">已用天数</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="purchaseDate">购入日期</label>
                        <input type="date" id="purchaseDate" required>
                    </div>
                    <div class="form-group">
                        <label for="daysUsed">已用天数</label>
                        <input type="number" id="daysUsed" min="1" placeholder="1" disabled>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    添加物品
                </button>
            </form>
        </div>

        <!-- 物品列表 -->
        <div class="items-list" id="itemsContainer">
            <div class="status-message status-empty" id="emptyState">
                还没有添加任何物品，开始添加吧！
            </div>
        </div>
    </div>

    <!-- 编辑物品模态框 -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1000;">
        <div style="background-color: var(--card-bg); border-radius: var(--border-radius); padding: var(--spacing-xl); max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md);">
            <h2 style="margin-bottom: var(--spacing-lg); font-size: 1.5rem;">编辑物品</h2>
            <form id="editItemForm">
                <input type="hidden" id="editItemId">
                
                <div class="form-group">
                    <label for="editItemName">物品名称</label>
                    <input type="text" id="editItemName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="editItemPrice">价格 (¥)</label>
                        <input type="number" id="editItemPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="editDateType">日期输入</label>
                        <select id="editDateType">
                            <option value="date">购入日期</option>
                            <option value="days">已用天数</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editPurchaseDate">购入日期</label>
                        <input type="date" id="editPurchaseDate">
                    </div>
                    <div class="form-group">
                        <label for="editDaysUsed">已用天数</label>
                        <input type="number" id="editDaysUsed" min="1" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <button type="button" id="cancelEdit" class="btn btn-secondary">
                        取消
                    </button>
                    <button type="submit" class="btn btn-success">
                        保存更改
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
