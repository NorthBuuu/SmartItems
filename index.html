<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能物品成本管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-focus {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-focus:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">智能物品成本管理</h1>
            <p class="text-gray-600">轻松追踪物品使用成本，优化消费决策</p>
        </header>

        <!-- Add Item Form -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 card">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">添加新物品</h2>
            <form id="itemForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label for="itemName" class="block text-sm font-medium text-gray-700 mb-1">物品名称</label>
                    <input type="text" id="itemName" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus">
                </div>
                <div>
                    <label for="itemPrice" class="block text-sm font-medium text-gray-700 mb-1">价格 (¥)</label>
                    <input type="number" id="itemPrice" step="0.01" required min="0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus">
                </div>
                <div>
                    <label for="purchaseDate" class="block text-sm font-medium text-gray-700 mb-1">购入日期</label>
                    <input type="date" id="purchaseDate"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus">
                </div>
                <div>
                    <label for="purchaseDays" class="block text-sm font-medium text-gray-700 mb-1">购入天数 (可选)</label>
                    <input type="number" id="purchaseDays" min="1"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus">
                </div>
                <div class="md:col-span-2 lg:col-span-4">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2">
                        <i class="fas fa-plus"></i>
                        添加物品
                    </button>
                </div>
            </form>
        </div>

        <!-- Items List -->
        <div class="bg-white rounded-2xl shadow-sm p-6 card">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">物品列表</h2>
            <div id="itemsList" class="space-y-4">
                <!-- Items will be dynamically added here -->
            </div>
            <div id="emptyState" class="text-center py-12 hidden">
                <i class="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500">暂无物品，请添加第一个物品</p>
            </div>
        </div>
    </div>

    <script type="module" src="src/types.js"></script>
    <script type="module" src="src/utils.js"></script>
    <script type="module" src="src/store.js"></script>
    <script type="module" src="src/components/ItemCard.js"></script>
    <script type="module" src="src/app.js"></script>
</body>
</html>
